<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Fleurs pour Hanna</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Noto+Serif+Georgian:wght@400;500&family=Pinyon+Script&display=swap">
<style>
/* Layout: one night screen. Her name and the note sit in the upper sky; a garden
   grows up from the bottom edge in an arch that frames the text. */
:root{
  --night:#0e0719;
  --plum:#2a0f33;
  --dusk:#4d1b42;
  --cream:#fff0ea;
  --rose:#ff8fb0;
  --gold:#ffd59a;
  --glow-rose:rgba(255,120,150,.36);
  --glow-lilac:rgba(190,120,255,.16);
  --shade:rgba(14,7,25,.72);
  --font-name:'Pinyon Script','Snell Roundhand','Apple Chancery',cursive;
  --font-text:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --font-ka:'Noto Serif Georgian','Cormorant Garamond',Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--cream);
  font-family:var(--font-text);
  overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.sky{
  position:fixed;inset:0;
  background:
    radial-gradient(120% 60% at 50% 106%,var(--glow-rose),transparent 62%),
    radial-gradient(70% 40% at 50% 22%,var(--glow-lilac),transparent 70%),
    linear-gradient(var(--night),var(--plum) 55%,var(--dusk));
}
#garden{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;cursor:pointer}
.note{
  position:relative;z-index:2;height:100%;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding-block:clamp(26px,8vh,84px) 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;
}
.ka{
  font-family:var(--font-ka);font-size:clamp(.95rem,3.6vw,1.2rem);
  letter-spacing:.32em;margin-right:-.32em;color:var(--gold);
  display:flex;align-items:center;gap:.9em;
  animation:fade 1.6s .2s both;
}
.ka::before,.ka::after{content:"";width:clamp(18px,7vw,46px);height:1px;background:currentColor;opacity:.55}
.name{
  margin:0;font-family:var(--font-name);font-weight:400;
  font-size:clamp(4.6rem,min(29vw,27vh),13rem);line-height:1.12;
  color:var(--cream);
  text-shadow:0 0 .35em rgba(255,143,176,.55),0 0 1.1em rgba(255,143,176,.28);
  padding:0 .15em;
}
.name span{
  display:inline-block;opacity:0;
  animation:letter 1.5s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay:calc(.55s + var(--i)*.24s);
}
.msg{
  margin:clamp(2px,1vh,12px) 0 0;max-width:27ch;
  font-style:italic;font-weight:500;
  font-size:clamp(1.22rem,4.7vw,1.75rem);line-height:1.34;
  text-wrap:balance;
  text-shadow:0 1px 14px var(--shade),0 0 30px var(--shade);
  animation:fade 2s 2.1s both;
}
.msg svg{
  width:.82em;height:.82em;vertical-align:-.08em;margin-left:.2em;fill:var(--rose);
  filter:drop-shadow(0 0 6px rgba(255,143,176,.8));
  animation:beat 1.5s 3.6s infinite;
}
.hint{
  position:fixed;z-index:3;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  max-width:calc(100% - 32px);white-space:nowrap;
  font-family:var(--font-text);font-size:1.02rem;letter-spacing:.04em;
  padding:.5em 1.15em;border-radius:99px;
  background:var(--shade);color:var(--cream);
  border:1px solid rgba(255,240,234,.2);
  pointer-events:none;opacity:0;
  animation:fade 1.4s 5s forwards;transition:opacity .7s;
}
.hint.gone{animation:none;opacity:0}
.snd{
  position:fixed;z-index:4;
  top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  width:44px;height:44px;border-radius:50%;padding:0;
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
  background:var(--shade);color:var(--cream);border:1px solid rgba(255,240,234,.22);
}
.snd svg{width:22px;height:22px;fill:currentColor}
.snd .off{display:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.snd[aria-pressed="true"]{color:rgba(255,240,234,.55)}
.snd[aria-pressed="true"] .off{display:block}
.snd:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes letter{
  from{opacity:0;filter:blur(14px);transform:translateY(.18em)}
  to{opacity:1;filter:blur(0);transform:none}
}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.28)}24%{transform:scale(1)}36%{transform:scale(1.18)}48%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  .ka,.msg,.hint,.msg svg,.name span{animation:none;opacity:1;filter:none;transform:none}
  .hint.gone{opacity:0}
}
</style>

<div class="sky" aria-hidden="true"></div>
<canvas id="garden" aria-label="Un jardin de fleurs qui pousse pour Hanna"></canvas>

<main class="note">
  <div class="ka" lang="ka">შენთვის</div>
  <h1 class="name" aria-label="Hanna"><span style="--i:0">H</span><span style="--i:1">a</span><span style="--i:2">n</span><span style="--i:3">n</span><span style="--i:4">a</span></h1>
  <p class="msg">De la part de ton Géorgien préféré et de ton homme, voilà les fleurs que je peux t’offrir pour l’instant<svg viewBox="0 0 24 24" aria-label="cœur" role="img"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></p>
</main>

<div class="hint" id="hint">Monte le son et touche l’écran</div>
<button class="snd" id="snd" type="button" aria-pressed="false" aria-label="Couper le son">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/><path class="off" d="M4 4l16 16"/></svg>
</button>

<script>
(function(){
'use strict';
var cv=document.getElementById('garden'),ctx=cv.getContext('2d');
var hint=document.getElementById('hint');
var REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var TAU=Math.PI*2,W=0,H=0,DPR=1,unit=18;
var MAX=64,MAX_USER=30;

function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function easeOut(x){return 1-Math.pow(1-x,3)}
function easeInOut(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function easeBack(x){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix(a,b,t){return'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')'}
function mixA(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}

var DARK=hex('#2a0f33');
var PAL=[
  {a:'#ff6f9f',b:'#ffd3df',c:'#ffd27a'},
  {a:'#ff8562',b:'#ffd9c2',c:'#ffe08a'},
  {a:'#ffe9c4',b:'#ffffff',c:'#ffc04d'},
  {a:'#a884ff',b:'#ead9ff',c:'#ffd98a'},
  {a:'#e23f95',b:'#ffa6d0',c:'#ffe3a0'},
  {a:'#e8324f',b:'#ff97a3',c:'#ffd27a'},
  {a:'#ff9ecb',b:'#fff0f6',c:'#ffcf6e'}
].map(function(p){return{a:hex(p.a),b:hex(p.b),c:hex(p.c)}});
var LAV=[{a:hex('#8f7bff'),b:hex('#c9b8ff')},{a:hex('#b06cf0'),b:hex('#e2c4ff')}];
var STEM=hex('#3f9a70'),LEAF=hex('#55b983');
var PETAL_COLORS=['#ff8fb0','#ffc2d4','#ffd9c2','#e6c8ff','#ff6f9f','#fff0ea'];

function makeFlower(r,opt){
  var roll=r(),type=roll<.3?'daisy':roll<.6?'peony':roll<.82?'tulip':'lavender';
  var depth=opt.depth,fade=[.5,.2,0][depth],ds=[.62,.82,1][depth];
  var p=type==='lavender'?LAV[Math.floor(r()*LAV.length)]:PAL[Math.floor(r()*PAL.length)];
  var a=mixA(p.a,DARK,fade),b=mixA(p.b,DARK,fade);
  var f={
    type:type,depth:depth,ds:ds,nx:opt.nx,hn:opt.hn,
    lean:(r()-.5)*3.4,bend:(r()-.5)*4.2,
    size:.85+r()*.6,rot:r()*TAU,ph:r()*TAU,
    n:9+Math.floor(r()*6),
    t0:opt.t0,dur:opt.dur,die:0,
    stem:mix(STEM,DARK,fade),leaf:mix(LEAF,DARK,fade),
    leaves:[{t:.16+r()*.1,s:1},{t:.36+r()*.14,s:-1},{t:.58+r()*.1,s:1}],
    ca:mix(a,a,0),cb:mix(b,b,0),
    back:mix(a,DARK,.3),
    core:p.c?mix(mixA(p.c,DARK,fade),DARK,0):'',
    coreDot:p.c?mix(mixA(p.c,DARK,fade),DARK,.35):'',
    layers:[mix(a,DARK,.18),mix(a,b,.22),mix(a,b,.55),mix(a,b,.9)],
    edge:'rgba(60,5,40,.28)'
  };
  var g=ctx.createRadialGradient(0,0,.12,0,0,1);
  g.addColorStop(0,f.cb);g.addColorStop(1,f.ca);f.grad=g;
  var tg=ctx.createLinearGradient(0,0,0,-1.5);
  tg.addColorStop(0,mix(a,DARK,.25));tg.addColorStop(1,f.cb);f.tgrad=tg;
  return f;
}

/* ---------- the planted garden (seeded so it looks the same every visit) ---------- */
var seedR=rng(20261111),garden=[],active=[],user=[];
for(var i=0;i<MAX;i++){
  var nx=.02+seedR()*.96,edge=Math.abs(nx-.5)*2;
  var dr=seedR(),depth=dr<.3?0:dr<.68?1:2;
  var hn=.13+.3*Math.pow(edge,1.5)+seedR()*.1+(depth===0?.03:0);
  garden.push(makeFlower(seedR,{nx:nx,hn:hn,depth:depth,t0:.4+seedR()*2.8+edge*.6,dur:2.4+seedR()*1.5}));
}
var blades=[];
for(i=0;i<110;i++)blades.push({nx:seedR(),h:1.4+seedR()*3.4,lean:(seedR()-.5)*2.4,ph:seedR()*TAU,c:seedR()<.5?0:1});
var stars=[];
for(i=0;i<80;i++)stars.push({nx:seedR(),ny:seedR()*.62,r:.5+seedR()*1.1,ph:seedR()*TAU,sp:.6+seedR()*1.6});
var flies=[];
for(i=0;i<16;i++)flies.push({nx:seedR(),ny:.3+seedR()*.62,ph:seedR()*TAU,sp:.25+seedR()*.4,s:9+seedR()*14});

var glow=document.createElement('canvas');glow.width=glow.height=64;
(function(){var g=glow.getContext('2d'),rg=g.createRadialGradient(32,32,0,32,32,32);
  rg.addColorStop(0,'rgba(255,236,180,1)');rg.addColorStop(.25,'rgba(255,214,150,.55)');rg.addColorStop(1,'rgba(255,200,140,0)');
  g.fillStyle=rg;g.fillRect(0,0,64,64)})();

/* ---------- particles: drifting petals, tap bursts, little hearts ---------- */
var parts=[];
function ambient(p,fresh){
  p.kind='petal';p.x=Math.random()*W;p.y=fresh?Math.random()*H:-20-Math.random()*H*.3;
  p.vx=(Math.random()-.5)*14;p.vy=22+Math.random()*30;p.rot=Math.random()*TAU;p.vr=(Math.random()-.5)*1.6;
  p.ph=Math.random()*TAU;p.size=5+Math.random()*7;p.color=PETAL_COLORS[Math.floor(Math.random()*PETAL_COLORS.length)];
  p.life=Infinity;p.max=Infinity;return p;
}
function burst(x,y,n,hearts){
  for(var k=0;k<n;k++){
    var an=Math.random()*TAU,sp=40+Math.random()*120;
    parts.push({kind:'burst',x:x,y:y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-50,rot:Math.random()*TAU,vr:(Math.random()-.5)*6,
      ph:Math.random()*TAU,size:4+Math.random()*6,color:PETAL_COLORS[Math.floor(Math.random()*PETAL_COLORS.length)],life:1.3+Math.random()*.7,max:2});
  }
  for(k=0;k<(hearts||0);k++){
    parts.push({kind:'heart',x:x+(Math.random()-.5)*30,y:y,vx:(Math.random()-.5)*24,vy:-38-Math.random()*30,rot:(Math.random()-.5)*.5,vr:0,
      ph:Math.random()*TAU,size:6+Math.random()*6,color:'#ff8fb0',life:2.2,max:2.2});
  }
}

/* ---------- drawing ---------- */
function petal(L,Wd){
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(Wd,-L*.25,Wd*.9,-L*.95,0,-L);
  ctx.bezierCurveTo(-Wd*.9,-L*.95,-Wd,-L*.25,0,0);
}
function heartPath(){
  ctx.beginPath();ctx.moveTo(0,.35);
  ctx.bezierCurveTo(-1.1,-.35,-.45,-1.05,0,-.45);
  ctx.bezierCurveTo(.45,-1.05,1.1,-.35,0,.35);
}
function drawHead(f,x,y,ang,b,sway){
  var s=f.size*unit*f.ds*(.12+.88*easeBack(b));
  if(s<=0)return;
  var k,j,open=easeOut(b);
  ctx.save();ctx.translate(x,y);
  if(f.type==='tulip'){
    ctx.rotate(ang);ctx.scale(s,s);
    var sp=.12+.26*open;
    ctx.fillStyle=f.back;
    ctx.save();ctx.rotate(-sp);petal(1.45,.5);ctx.fill();ctx.restore();
    ctx.save();ctx.rotate(sp);petal(1.45,.5);ctx.fill();ctx.restore();
    ctx.fillStyle=f.tgrad;petal(1.5,.56);ctx.fill();
  }else if(f.type==='daisy'){
    ctx.rotate(f.rot+sway*.004);ctx.scale(s,s);
    var st=TAU/f.n;
    ctx.fillStyle=f.back;
    for(k=0;k<f.n;k++){ctx.rotate(st);petal(1.05,.2);ctx.fill()}
    ctx.rotate(st/2);ctx.fillStyle=f.grad;
    for(k=0;k<f.n;k++){ctx.rotate(st);petal(.92*(.4+.6*open),.2);ctx.fill()}
    ctx.fillStyle=f.core;ctx.beginPath();ctx.arc(0,0,.27,0,TAU);ctx.fill();
    ctx.fillStyle=f.coreDot;ctx.beginPath();ctx.arc(0,0,.13,0,TAU);ctx.fill();
  }else{ /* peony */
    ctx.rotate(f.rot+sway*.004);ctx.scale(s,s);
    var LAY=[[8,1,.5],[7,.78,.42],[5,.55,.33],[3,.32,.24]];
    ctx.lineWidth=.035;ctx.strokeStyle=f.edge;
    for(j=0;j<4;j++){
      var n=LAY[j][0],L=LAY[j][1]*(.55+.45*open),st2=TAU/n;
      ctx.rotate(.5+j*.37);ctx.fillStyle=f.layers[j];
      for(k=0;k<n;k++){ctx.rotate(st2);petal(L,LAY[j][2]);ctx.fill();ctx.stroke()}
    }
  }
  ctx.restore();
}
function drawFlower(f,t){
  var g=clamp((t-f.t0)/f.dur,0,1);
  if(g<=0)return;
  var alpha=1;
  if(f.die){alpha=1-clamp((t-f.die)/.9,0,1);if(alpha<=0)return}
  var ge=easeInOut(g),b=clamp((t-f.t0-f.dur*.78)/1.5,0,1);
  var h=f.hn*H,bx=f.nx*W;
  var sw=REDUCED?0:Math.sin(t*.9+f.ph)*h*.034+Math.sin(t*.37+f.ph*2)*unit*.28;
  var x0=bx,y0=H+8,x1=bx+f.bend*unit+sw*.35,y1=H-h*.55,x2=bx+f.lean*unit+sw,y2=H-h;
  var ax=lerp(x0,x1,ge),ay=lerp(y0,y1,ge),cx=lerp(x1,x2,ge),cy=lerp(y1,y2,ge);
  var ex=lerp(ax,cx,ge),ey=lerp(ay,cy,ge);
  var su=f.size*unit*f.ds;
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=f.stem;ctx.lineWidth=Math.max(1.2,su*.12);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(ax,ay,ex,ey);ctx.stroke();
  /* leaves ride the same curve */
  ctx.fillStyle=f.leaf;
  for(var i=0;i<f.leaves.length;i++){
    var lf=f.leaves[i];if(ge<=lf.t)continue;
    if(f.type==='lavender'&&lf.t>.5)continue;
    var u=lf.t,mu=1-u;
    var lx=mu*mu*x0+2*mu*u*x1+u*u*x2,ly=mu*mu*y0+2*mu*u*y1+u*u*y2;
    var tx=2*mu*(x1-x0)+2*u*(x2-x1),ty=2*mu*(y1-y0)+2*u*(y2-y1);
    var la=Math.atan2(ty,tx)+Math.PI/2+lf.s*(.95+(REDUCED?0:Math.sin(t*1.1+f.ph+i)*.08));
    var ls=su*.62*easeOut(clamp((ge-lf.t)*4,0,1));
    ctx.save();ctx.translate(lx,ly);ctx.rotate(la);ctx.scale(ls,ls);petal(1.7,.36);ctx.fill();ctx.restore();
  }
  if(f.type==='lavender'){
    for(var q=0;q<10;q++){
      var u2=.58+q*.042;if(ge<u2)break;
      var m2=1-u2,px=m2*m2*x0+2*m2*u2*x1+u2*u2*x2,py=m2*m2*y0+2*m2*u2*y1+u2*u2*y2;
      var pop=easeOut(clamp((ge-u2)*9+b,0,1)),rad=su*(.27-q*.016)*pop;
      ctx.fillStyle=q%2?f.ca:f.cb;
      ctx.beginPath();ctx.arc(px+(q%2?1:-1)*su*.17*(q<9?1:0),py,rad,0,TAU);ctx.fill();
    }
  }else if(b>0){
    drawHead(f,ex,ey,Math.atan2(cy-ay,cx-ax)+Math.PI/2,b,sw);
  }
  ctx.globalAlpha=1;
}
function draw(t,dt){
  ctx.clearRect(0,0,W,H);
  var i,p;
  /* stars */
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=REDUCED?.6:.28+.5*(.5+.5*Math.sin(t*s.sp+s.ph));
    ctx.fillStyle='#fff0ea';ctx.fillRect(s.nx*W,s.ny*H,s.r,s.r);
  }
  ctx.globalAlpha=1;
  /* grass */
  var gk=easeOut(clamp(t/2.4,0,1));
  for(var c=0;c<2;c++){
    ctx.beginPath();
    for(i=0;i<blades.length;i++){
      var bl=blades[i];if(bl.c!==c)continue;
      var gx=bl.nx*W,gh=bl.h*unit*gk,gs=REDUCED?0:Math.sin(t*1.2+bl.ph)*unit*.3;
      ctx.moveTo(gx,H+4);ctx.quadraticCurveTo(gx+bl.lean*unit*.3,H-gh*.6,gx+bl.lean*unit+gs,H-gh);
    }
    ctx.strokeStyle=c?'#2f7a5c':'#245f4c';ctx.lineWidth=Math.max(1.5,unit*.11);ctx.lineCap='round';ctx.stroke();
  }
  for(i=0;i<active.length;i++)drawFlower(active[i],t);
  for(i=user.length-1;i>=0;i--){
    var uf=user[i];
    if(uf.die&&t-uf.die>.9){user.splice(i,1);continue}
  }
  for(i=0;i<user.length;i++)drawFlower(user[i],t);
  /* particles */
  for(i=parts.length-1;i>=0;i--){
    p=parts[i];
    if(dt){
      p.life-=dt;
      if(p.kind==='petal'){p.x+=(p.vx+Math.sin(t*.8+p.ph)*18)*dt;p.y+=p.vy*dt;if(p.y>H+24||p.x<-40||p.x>W+40)ambient(p,false)}
      else if(p.kind==='burst'){p.vy+=150*dt;p.vx*=1-1.2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
      else{p.x+=(p.vx+Math.sin(t*3+p.ph)*14)*dt;p.y+=p.vy*dt}
      p.rot+=p.vr*dt;p.ph+=dt*2.4;
      if(p.life<=0){parts.splice(i,1);continue}
    }
    var al=p.kind==='petal'?.85:clamp(p.life/(p.max*.5),0,1);
    ctx.globalAlpha=al;ctx.fillStyle=p.color;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.kind==='heart'){ctx.scale(p.size,p.size);heartPath();ctx.fill()}
    else{ctx.scale(p.size*(.35+.65*Math.abs(Math.cos(p.ph))),p.size);ctx.translate(0,.5);petal(1,.46);ctx.fill()}
    ctx.restore();
  }
  ctx.globalAlpha=1;
  /* fireflies */
  ctx.globalCompositeOperation='lighter';
  for(i=0;i<flies.length;i++){
    var fl=flies[i];
    var fx=fl.nx*W+(REDUCED?0:Math.sin(t*fl.sp+fl.ph)*W*.06),fy=fl.ny*H+(REDUCED?0:Math.cos(t*fl.sp*.7+fl.ph)*H*.05);
    ctx.globalAlpha=(REDUCED?.5:.3+.4*(.5+.5*Math.sin(t*1.9+fl.ph)))*clamp(t/3,0,1);
    ctx.drawImage(glow,fx-fl.s,fy-fl.s,fl.s*2,fl.s*2);
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
}

/* ---------- sizing ---------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth||document.documentElement.clientWidth;H=window.innerHeight||document.documentElement.clientHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  unit=clamp(Math.min(W,H)/24,14,27);
  var count=clamp(Math.round(W/15),24,MAX);
  active=garden.slice(0,count).sort(function(a,b){return a.depth-b.depth});
  var want=clamp(Math.round(W/26),14,40),have=0,i;
  for(i=0;i<parts.length;i++)if(parts[i].kind==='petal')have++;
  for(;have<want;have++)parts.push(ambient({},true));
  if(REDUCED)draw(now(),0);
}

/* ---------- clock + loop ---------- */
var start=performance.now(),last=start;
function now(){return REDUCED?1000:(performance.now()-start)/1000}
function frame(ts){
  var dt=Math.min((ts-last)/1000,.05);last=ts;
  draw((ts-start)/1000,dt);
  requestAnimationFrame(frame);
}

/* ---------- sound: a soft pad, a sparse music box, a chime per flower ---------- */
var AC=null,master,dry,wet,padIn,muted=false;
var CH=[[261.63,329.63,392.00,493.88],[220.00,261.63,329.63,392.00],[174.61,220.00,261.63,329.63],[196.00,246.94,293.66,329.63]];
var CHLEN=7,chordN=0,nextChord=0,nextNote=0,curChord=CH[0],prevChord=CH[0],curStart=0;
var sndBtn=document.getElementById('snd');
function initAudio(){
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{AC=new C()}catch(e){AC=null;return}
  master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
  dry=AC.createGain();dry.gain.value=.7;dry.connect(master);
  var len=Math.floor(AC.sampleRate*3),buf=AC.createBuffer(2,len,AC.sampleRate);
  for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  var conv=AC.createConvolver();conv.buffer=buf;
  wet=AC.createGain();wet.gain.value=.5;wet.connect(conv);conv.connect(master);
  padIn=AC.createBiquadFilter();padIn.type='lowpass';padIn.frequency.value=1100;padIn.connect(dry);padIn.connect(wet);
  setInterval(schedule,200);
}
function unlock(){
  if(!AC)initAudio();
  if(!AC)return;
  if(AC.state==='suspended'&&!document.hidden)AC.resume();
  master.gain.setTargetAtTime(muted?0:.9,AC.currentTime,.7);
}
function tone(f,t,peak,att,end,dest,type){
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);
  o.connect(g);g.connect(dest);o.start(t);o.stop(end+.1);
  return g.gain;
}
function pad(ch,t){
  var end=t+CHLEN+3.5,k,gn;
  for(k=0;k<ch.length;k++){
    gn=tone(ch[k],t,.026,2.6,end,padIn);gn.setValueAtTime(.026,t+CHLEN);gn.linearRampToValueAtTime(0,end);
    gn=tone(ch[k]*1.004,t,.02,3,end,padIn);gn.setValueAtTime(.02,t+CHLEN);gn.linearRampToValueAtTime(0,end);
  }
  gn=tone(ch[0]/2,t,.05,2.2,end,padIn);gn.setValueAtTime(.05,t+CHLEN);gn.linearRampToValueAtTime(0,end);
}
function bell(f,t,peak,dur){
  var out=AC.createGain();out.connect(dry);out.connect(wet);
  var parts3=[[1,1],[2,.28],[3.01,.08]];
  for(var k=0;k<3;k++){
    var gn=tone(f*parts3[k][0],t,peak*parts3[k][1],.008,t+dur,out);
    gn.exponentialRampToValueAtTime(.0001,t+dur/(1+k*.6));
  }
}
function schedule(){
  if(!AC||AC.state!=='running')return;
  var t=AC.currentTime;
  if(nextChord<t-.5){nextChord=t+.05;nextNote=t+2.2}
  while(nextChord<t+1){
    prevChord=curChord;curChord=CH[chordN%CH.length];curStart=nextChord;
    pad(curChord,nextChord);chordN++;nextChord+=CHLEN;
  }
  while(nextNote<t+.5){
    var ch=nextNote>=curStart?curChord:prevChord;
    if(Math.random()<.72)bell(ch[Math.floor(Math.random()*4)]*(Math.random()<.3?4:2),nextNote,.032,2.4);
    nextNote+=Math.random()<.3?1.75:.875;
  }
}
function chime(y){
  if(!AC||muted||AC.state!=='running')return;
  var t=AC.currentTime,ch=t>=curStart?curChord:prevChord;
  var i=clamp(Math.floor((1-y/H)*8),0,7),f=ch[i%4]*(i<4?2:4);
  bell(f,t+.005,.1,1.9);
  bell(ch[(i+2)%4]*(i<4?4:8)/(i>5?2:1),t+.11,.045,1.6);
}
sndBtn.addEventListener('pointerdown',function(e){e.stopPropagation()});
sndBtn.addEventListener('click',function(){
  muted=!muted;
  sndBtn.setAttribute('aria-pressed',muted?'true':'false');
  sndBtn.setAttribute('aria-label',muted?'Remettre le son':'Couper le son');
  unlock();
});
window.addEventListener('pointerup',unlock);
document.addEventListener('visibilitychange',function(){
  if(!AC)return;
  if(document.hidden)AC.suspend();else AC.resume();
});

/* ---------- touch: plant a flower where she taps ---------- */
var tapR=rng(7),dragging=false,lastTrail=0;
function plant(x,y){
  var t=now(),yy=clamp(y,H*.06,H-unit*2);
  var f=makeFlower(tapR,{nx:0,hn:(H-yy)/H,depth:2,t0:REDUCED?-100:t,dur:REDUCED?1:1.1+(H-yy)/H*1.2});
  if(f.type==='lavender')f.type=tapR()<.5?'peony':'daisy';
  f.size=1.05+tapR()*.55;
  f.nx=(x-f.lean*unit)/W;
  user.push(f);
  var alive=0,i;
  for(i=user.length-1;i>=0;i--){if(!user[i].die){alive++;if(alive>MAX_USER)user[i].die=t}}
  burst(x,yy,REDUCED?0:12,REDUCED?0:3);
  if(REDUCED)draw(t,0);
}
window.addEventListener('pointerdown',function(e){
  dragging=true;unlock();plant(e.clientX,e.clientY);chime(e.clientY);hint.classList.add('gone');
});
window.addEventListener('pointermove',function(e){
  if(!dragging||REDUCED)return;
  var n=performance.now();if(n-lastTrail<45)return;lastTrail=n;
  burst(e.clientX,e.clientY,2,Math.random()<.18?1:0);
});
window.addEventListener('pointerup',function(){dragging=false});
window.addEventListener('pointercancel',function(){dragging=false});
window.addEventListener('resize',resize);

resize();
if(!REDUCED)requestAnimationFrame(function(ts){start=last=ts;requestAnimationFrame(frame)});
})();
</script>
